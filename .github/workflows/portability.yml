name: Cross-Platform & Non-Linux Matrix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Windows Native Matrix (MSVC 2022 & MinGW-w64)
  # =========================================================================
  windows-matrix:
    name: Windows (${{ matrix.compiler }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
          - compiler: msvc-debug
            generator: "Visual Studio 17 2022"
            build_type: Debug
          - compiler: mingw
            generator: "Ninja"
            build_type: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64 (if MinGW build)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Configure CMake (MSVC)
        if: matrix.compiler != 'mingw'
        run: cmake -B build -S . -G "${{ matrix.generator }}" -A x64 -DLIBHISTO_ENABLE_FUZZING=ON

      - name: Build C Library & Tests (MSVC)
        if: matrix.compiler != 'mingw'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Run Test Suite (MSVC)
        if: matrix.compiler != 'mingw'
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure -j 4

      - name: Configure CMake (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -B build -S . -G "Ninja" \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DLIBHISTO_ENABLE_FUZZING=ON

      - name: Build C Library & Tests (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build --parallel 4

      - name: Run Test Suite (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -j 4

  # =========================================================================
  # 2. macOS Apple Silicon Native (Apple Clang / ARM64 NEON)
  # =========================================================================
  macos-native:
    name: macOS ARM64 (${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DLIBHISTO_ENABLE_FUZZING=ON

      - name: Build Core C Library & Tests
        run: cmake --build build --parallel 4

      - name: Run C Test Suite
        run: ctest --test-dir build --output-on-failure -j 4

      - name: Validate Python Bindings
        run: |
          cd bindings/python
          python3 -m pip install --upgrade pip setuptools wheel numpy
          python3 setup.py build_ext --inplace
          PYTHONPATH=. python3 -m unittest discover -s tests -v

  # =========================================================================
  # 3. FreeBSD VM Matrix (BSD libc / strict POSIX)
  # =========================================================================
  freebsd-vm:
    name: FreeBSD 14.0 (Clang / BSD libc)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run FreeBSD VM Build & Test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja python3 bash
          run: |
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBHISTO_ENABLE_FUZZING=ON
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure -j 4

  # =========================================================================
  # 4. Minimal Hermetic Core C99 Container (Debian minimal build-essential)
  # =========================================================================
  hermetic-c99:
    name: Minimal Hermetic C99 (Debian baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Hermetic Core C99 Build & Test in Debian Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bookworm-slim \
            sh -c "apt-get update -qq && \
                   apt-get install -y -qq --no-install-recommends gcc libc6-dev make cmake && \
                   cmake -B build-hermetic -S . \
                         -DCMAKE_BUILD_TYPE=Release \
                         -DLIBHISTO_BUILD_TOOLS=OFF \
                         -DLIBHISTO_BUILD_BENCHMARKS=OFF \
                         -DLIBHISTO_BUILD_EXAMPLES=OFF \
                         -DLIBHISTO_ENABLE_FUZZING=OFF && \
                   cmake --build build-hermetic --parallel 4 && \
                   ctest --test-dir build-hermetic --output-on-failure -j 4"
